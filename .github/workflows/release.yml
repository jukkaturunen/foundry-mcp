name: Release Foundry module
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check module version matches tag
        run: |
          v=$(jq -r .version module/module.json)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "module.json version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Build module zip
        run: cd module && zip -r ../foundry-mcp-bridge.zip module.json scripts lang
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" foundry-mcp-bridge.zip module/module.json --title "$GITHUB_REF_NAME" --generate-notes
