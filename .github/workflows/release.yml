name: Release Foundry module
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check module version matches tag
        run: |
          v=$(jq -r .version module/module.json)
          [ "v$v" = "$TAG" ] || { echo "module.json version $v does not match tag $TAG"; exit 1; }
      - name: Build module zip
        run: cd module && zip -r ../foundry-mcp-bridge.zip module.json scripts lang
      - name: Create release or add files to it
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" foundry-mcp-bridge.zip module/module.json --clobber
          else
            gh release create "$TAG" foundry-mcp-bridge.zip module/module.json --title "$TAG" --generate-notes
          fi
